<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>IQ Signal Engine</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050b14;
    color: #e8eef7;
    min-height: 100vh;
}

button, select {
    font: inherit;
}

.header {
    background: #081525;
    border-bottom: 1px solid #1b2b40;
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #16a36a;
    display: grid;
    place-items: center;
    font-weight: bold;
    color: white;
}

.logo h1 {
    font-size: 19px;
}

.logo p {
    color: #8291a5;
    font-size: 11px;
    margin-top: 3px;
}

.status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #6fe2aa;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: #26d980;
    border-radius: 50%;
    box-shadow: 0 0 10px #26d980;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    margin-bottom: 15px;
}

.control-box {
    background: #0a1625;
    border: 1px solid #1c3048;
    border-radius: 10px;
    padding: 10px;
}

.control-box label {
    display: block;
    color: #75859a;
    font-size: 10px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

select {
    width: 100%;
    background: transparent;
    color: white;
    border: 0;
    outline: none;
}

select option {
    background: #0a1625;
}

.analyze-btn {
    border: 0;
    border-radius: 10px;
    background: #16885c;
    color: white;
    font-weight: bold;
    padding: 0 18px;
    cursor: pointer;
}

.analyze-btn:active {
    transform: scale(.97);
}

.chart-card {
    background: #081321;
    border: 1px solid #1b2d43;
    border-radius: 14px;
    overflow: hidden;
}

.chart-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 15px;
    border-bottom: 1px solid #17283c;
}

.asset {
    font-weight: bold;
}

.price {
    color: #91a1b5;
    font-size: 13px;
    margin-left: 8px;
}

.candle-timer {
    font-size: 12px;
    color: #72dbaa;
}

.chart-wrap {
    height: 330px;
    width: 100%;
    position: relative;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.signal-card {
    margin-top: 15px;
    border-radius: 15px;
    background: #0a1625;
    border: 1px solid #1b3048;
    padding: 18px;
    text-align: center;
}

.signal-label {
    color: #8392a5;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.signal {
    font-size: 42px;
    font-weight: 900;
    margin: 7px 0;
}

.signal.call {
    color: #28d982;
}

.signal.put {
    color: #ff5367;
}

.signal.wait {
    color: #f0c75e;
}

.confidence {
    color: #aab7c7;
    font-size: 13px;
}

.confidence strong {
    color: white;
}

.signal-reason {
    margin-top: 9px;
    color: #77899e;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.metric {
    background: #091625;
    border: 1px solid #1a2c42;
    border-radius: 12px;
    padding: 13px;
}

.metric-title {
    color: #718298;
    font-size: 10px;
    text-transform: uppercase;
}

.metric-value {
    margin-top: 8px;
    font-size: 19px;
    font-weight: bold;
}

.metric-value.green {
    color: #2edb87;
}

.metric-value.red {
    color: #ff5b6c;
}

.metric-value.yellow {
    color: #efc65b;
}

.section {
    margin-top: 15px;
    background: #081321;
    border: 1px solid #1b2d43;
    border-radius: 14px;
    overflow: hidden;
}

.section-title {
    padding: 14px;
    font-weight: bold;
    border-bottom: 1px solid #17283c;
}

.analysis-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 14px;
    border-bottom: 1px solid #122235;
    font-size: 13px;
}

.analysis-row:last-child {
    border-bottom: 0;
}

.analysis-name {
    color: #8493a6;
}

.analysis-value {
    font-weight: bold;
}

.history {
    max-height: 260px;
    overflow-y: auto;
}

.history-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #122235;
    font-size: 12px;
}

.history-row:last-child {
    border-bottom: 0;
}

.history-call {
    color: #2edb87;
    font-weight: bold;
}

.history-put {
    color: #ff5b6c;
    font-weight: bold;
}

.history-wait {
    color: #efc65b;
    font-weight: bold;
}

.disclaimer {

    padding: 12px;
    border: 1px solid #28364a;
    border-radius: 10
